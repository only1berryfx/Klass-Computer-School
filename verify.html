    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .verification-card {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.276);
            text-align: center;
            transition: 0.5s ease;
        }

        .verification-card:hover {
            transform: translateY(-8px);

        }

        .logo {
            width: 200px;
            margin-bottom: 15px;
        }

        h1 {
            color: #073f7a;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .verified-icon {
            width: 110px;
            height: 110px;
            background: #e8f7ee;
            color: #159447;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            box-shadow:0 0px 30px #159448b2;
            font-size: 100px;
            font-weight: bold;
        }

        .status {
            color: #159447;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .details {
            text-align: left;
            background: #f7f9fc;
            border-radius: 10px;
            padding: 20px;
        }

        .detail {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 13px 0;
            border-bottom: 1px solid #ddd;
        }

        .detail:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #222;
            text-align: right;
        }

        .message {
            margin-top: 25px;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: #073f7a;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-button:hover {
            background: #027cff;
        }

        .invalid {
            color: #d93025;
        }

        .invalid-icon {
            background: #fdeaea;
            color: #d93025;
        }

        @media (max-width: 500px) {
            .verification-card {
                padding: 30px 20px;
            }

            .detail {
                flex-direction: column;
                gap: 5px;
            }

            .value {
                text-align: left;
            }
        }
    </style>
</head>
